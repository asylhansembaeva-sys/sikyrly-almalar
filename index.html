<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сиқырлы алмалар: дыбысты ажырат!</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:#7bd8ff url('garden.jpg') center/cover fixed;color:#11205b} .page{max-width:1450px;margin:auto;padding:12px 12px 26px;min-height:100vh}header{text-align:center;margin:0 auto 10px;max-width:1060px;background:linear-gradient(#ffe9a4,#ffa52e);border:6px solid #ba6923;border-radius:28px;box-shadow:0 7px 0 #87440e,0 12px 20px #0004;padding:10px 12px}h1{font-size:clamp(27px,4.2vw,57px);margin:0;font-weight:900;text-shadow:2px 2px #fff} .instruction{text-align:center;background:#fffdf1;border:3px solid #ffbe43;border-radius:25px;max-width:800px;margin:12px auto;padding:9px;font-size:clamp(22px,2.7vw,34px);font-weight:bold;color:#a32418}.board{background:#fffdf0f2;border:6px solid #ffc452;border-radius:25px;box-shadow:0 8px 18px #154b4b50;padding:16px 12px 12px;max-width:1150px;margin:auto}.apples{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;justify-items:center}.apple{position:relative;border:0;background:transparent url('apple.png') center/contain no-repeat;width:100%;max-width:100px;aspect-ratio:1/1.06;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 2px #0003);transition:transform .14s}.apple span{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);font:bold clamp(23px,3.2vw,47px) 'Times New Roman',serif;color:#090909;text-shadow:0 1px #fff8}.apple.selected{outline:4px dashed #ff8500;border-radius:22px;transform:scale(1.12)}.apple:hover{transform:scale(1.08)}.apple.done{visibility:hidden;pointer-events:none}.footer{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,2fr) minmax(0,2fr) minmax(80px,1fr);align-items:end;gap:8px;max-width:1300px;margin:12px auto}.kid{width:100%;max-height:280px;object-fit:contain;object-position:bottom;filter:drop-shadow(1px 3px 2px #0003)}.basket{position:relative;cursor:pointer;min-height:185px;display:flex;align-items:end;justify-content:center;transition:transform .15s;touch-action:manipulation}.basket:hover,.basket.active{transform:scale(1.04)}.basket img{width:100%;max-width:360px;display:block;filter:drop-shadow(0 5px 3px #0004)}.basket .tag{position:absolute;bottom:27%;left:10%;right:10%;display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 8px;border:3px solid var(--tone);border-radius:30px;background:#fffdf4ee;box-shadow:0 2px 4px #0003;font-size:clamp(14px,1.8vw,26px);font-weight:bold;color:var(--tone);text-align:center}.dot{width:clamp(23px,3.5vw,47px);height:clamp(23px,3.5vw,47px);border-radius:50%;background:var(--tone);box-shadow:inset -5px -5px 7px #0003,inset 4px 4px 5px #fff8;flex:none}.basket.red{--tone:#d51320}.basket.blue{--tone:#0758d6}.controls{text-align:center;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;background:#ffffffd9;border-radius:18px;padding:8px;max-width:800px;margin:6px auto}.controls button{font:bold 21px 'Times New Roman';background:#fff0a5;border:2px solid #b97a13;border-radius:14px;padding:8px 18px;cursor:pointer}.status{font-size:22px;font-weight:bold;color:#112d72}.burst{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.spark{position:absolute;width:9px;height:9px;border-radius:50%;animation:fly .85s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}.toast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);background:#fff4b7;border:5px solid #ffac1a;border-radius:28px;padding:18px 28px;font:bold clamp(30px,5vw,65px) 'Times New Roman';z-index:30;box-shadow:0 9px 25px #0005;display:none;text-align:center}.toast.show{display:block}.dragging{opacity:.4}@media(max-width:750px){.apples{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.board{padding:9px 5px}.apple span{font-size:clamp(24px,5vw,38px)}.footer{grid-template-columns:1fr 1fr;gap:4px}.kid{display:none}.basket{min-height:115px}.basket .tag{font-size:clamp(12px,3vw,18px);left:2%;right:2%;bottom:23%;padding:3px}.dot{width:25px;height:25px}.controls .status{font-size:18px}}@media(prefers-reduced-motion:reduce){.spark{animation-duration:.1s}}
.flying-apple{position:fixed;z-index:40;pointer-events:none;background:transparent url('apple.png') center/contain no-repeat;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s ease;filter:drop-shadow(0 4px 5px #0004)}.flying-apple span{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);font:bold clamp(23px,3.2vw,47px) 'Times New Roman',serif;color:#090909;text-shadow:0 1px #fff8}</style></head><body><div class="page"><header><h1>🍏 Сиқырлы алмалар: дыбысты ажырат!</h1></header><div class="instruction">Әріптерді тиісті себетке сал!</div><section class="board"><div class="apples" id="apples"></div></section><div class="footer"><img class="kid" src="girl.png" alt="Оқушы қыз"><div class="basket red" id="vowel" role="button" tabindex="0" aria-label="Дауысты дыбыстар"><img src="basket.png" alt="Өрілген себет"><div class="tag"><i class="dot"></i><span>Дауысты<br>дыбыстар</span></div></div><div class="basket blue" id="consonant" role="button" tabindex="0" aria-label="Дауыссыз дыбыстар"><img src="basket.png" alt="Өрілген себет"><div class="tag"><i class="dot"></i><span>Дауыссыз<br>дыбыстар</span></div></div><img class="kid" src="boy.png" alt="Оқушы ұл"></div><div class="controls"><span class="status" id="status">0 / 40 алма</span><button id="restart">🔄 Қайтадан бастау</button></div></div><div class="burst" id="burst"></div><div class="toast" id="toast"></div><script>
const letters='а ә б в г ғ д е ё ж з и й к қ л м н ң о ө п р с т у ұ ү ф х һ ц ч ш щ ы і э ю я'.split(' ');
// 40 әріп, У бір алма ретінде екі себетке бірдей түседі.
const vowels=new Set('а ә е ё и о ө ұ ү ы і э ю я'.split(' '));
const data=letters.map((letter,i)=>({letter,type:letter==='у'?'vowel':vowels.has(letter)?'vowel':'consonant',id:i}));

let selected=null,done=0,items=[];const area=document.getElementById('apples'),status=document.getElementById('status');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){done=0;selected=null;items=shuffle(data.map(x=>({...x})));area.innerHTML='';items.forEach(item=>{let b=document.createElement('button');b.className='apple';b.type='button';b.setAttribute('aria-label',item.letter+' әрпі');b.innerHTML='<span>'+item.letter+'</span>';b.dataset.id=item.id;item.el=b;area.appendChild(b);b.addEventListener('click',()=>{if(item.letter==='у'){choose(item);place('vowel')}else choose(item)});b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;item.px=e.clientX;item.py=e.clientY});b.addEventListener('pointerup',e=>{if(item.px===undefined)return;const el=document.elementFromPoint(e.clientX,e.clientY);const basket=el?.closest('.basket');if(basket&&Math.hypot(e.clientX-item.px,e.clientY-item.py)>15){choose(item);place(basket.id)}item.px=undefined}) ;b.draggable=true;b.addEventListener('dragstart',e=>{selected=item;e.dataTransfer.setData('text/plain',String(item.id))})});status.textContent='0 / '+data.length+' алма';hideToast()}
function choose(item){if(item.el.classList.contains('done'))return;document.querySelectorAll('.apple.selected').forEach(e=>e.classList.remove('selected'));selected=item;item.el.classList.add('selected')}
function flyApple(item,targets){
 const r=item.el.getBoundingClientRect();
 targets.forEach((type,index)=>{
  const dest=document.getElementById(type).getBoundingClientRect();
  const clone=document.createElement('div');clone.className='flying-apple';
  clone.style.left=r.left+'px';clone.style.top=r.top+'px';clone.style.width=r.width+'px';clone.style.height=r.height+'px';
  clone.innerHTML='<span>'+item.letter+'</span>';document.body.appendChild(clone);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   clone.style.transform='translate('+(dest.left+dest.width/2-r.left-r.width/2)+'px,'+(dest.top+dest.height*.4-r.top-r.height/2)+'px) scale(.48)';
   clone.style.opacity='0';
  }));setTimeout(()=>clone.remove(),850);
 });
}
function place(type){
 if(!selected)return;
 const item=selected;
 if(item.letter==='у'||item.type===type){
  flyApple(item,item.letter==='у'?['vowel','consonant']:[type]);
  item.el.classList.add('done');selected=null;done++;
  status.textContent=done+' / '+data.length+' алма';fireworks();
  showToast(done===data.length?'Жарайсың! Барлық тапсырманы орындадың!':item.letter==='у'?'Жарайсың! У екі себетке де түсті!':'Жарайсың!',done===data.length?2600:850);
 }else{showToast('Қайта ойланып көр!',850);item.el.classList.remove('selected');selected=null}
}
for(const type of ['vowel','consonant']){let b=document.getElementById(type);b.addEventListener('click',()=>place(type));b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(type)}});b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('active')});b.addEventListener('dragleave',()=>b.classList.remove('active'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('active');const id=Number(e.dataTransfer.getData('text/plain'));const item=items.find(x=>x.id===id);if(item){choose(item);place(type)}})}
let timer;function showToast(s,ms){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(hideToast,ms)}function hideToast(){document.getElementById('toast').classList.remove('show')}
function fireworks(){const layer=document.getElementById('burst');const colors=['#ff3355','#ffd000','#00bbff','#18dd71','#9b40ff','#ff8c00'];for(let j=0;j<32;j++){let el=document.createElement('i');el.className='spark';el.style.background=colors[j%colors.length];el.style.left=(25+Math.random()*50)+'%';el.style.top=(20+Math.random()*45)+'%';el.style.setProperty('--dx',(Math.random()*420-210)+'px');el.style.setProperty('--dy',(Math.random()*380-190)+'px');layer.appendChild(el);setTimeout(()=>el.remove(),900)}}
document.getElementById('restart').addEventListener('click',reset);reset();</script></body></html>
